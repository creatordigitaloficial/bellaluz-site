  renderVals() {
    var self = this;
    var st = this.state;
    var mask = function (v) {
      var d = String(v || '').replace(/\D/g, '').slice(0, 11);
      if (!d.length) return '';
      if (d.length <= 2) return '(' + d;
      if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
      if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);

      return {
        label: label, pressed: on ? 'true' : 'false',

    var waUrl = 'https://wa.me/551631000100?text=' + encodeURIComponent(msg);
    var submit = function () {
      var n = String(st.nome || '').trim();
      var es = String(st.escritorio || '').trim();
      var d = String(st.tel || '').replace(/\D/g, '');

      if (ne || ee || te) { self.setState({ nomeErr: ne, escErr: ee, telErr: te }); return; }
      self.setState({ done: true, nomeErr: '', escErr: '', telErr: '' });

    ];
    var faqs = qa.map(function (pair, i) {

      return { q: pair[0], a: pair[1], open: isOpen, expanded: isOpen ? 'true' : 'false', sign: isOpen ? '−' : '+', toggle: function () { self.setState({ open: isOpen ? -1 : i }); } };
    });

      onNome: function (e) { self.setState({ nome: e.target.value, nomeErr: '' }); },
      onEsc: function (e) { self.setState({ escritorio: e.target.value, escErr: '' }); },
      onCidade: function (e) { self.setState({ cidade: e.target.value }); },
      onCau: function (e) { self.setState({ cau: e.target.value }); },
      onTel: function (e) { self.setState({ tel: mask(e.target.value), telErr: '' }); },
      onIg: function (e) { self.setState({ ig: e.target.value }); },

      reset: function () { self.setState({ done: false }); }
