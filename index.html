<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-M2RBP7WN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<title>BellaLuz Lighting Store | Iluminação em Ribeirão Preto</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Tumbly';src:url(/assets/fonts/TumblyA.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Marlowe';src:url(/assets/fonts/Marlowe.woff2) format('woff2');font-display:swap}
body{margin:0;background:#161412}
a{color:#D1AB68;text-decoration:none}a:hover{color:#E6C98F}
*{box-sizing:border-box}
.page{font-family:Montserrat,sans-serif;font-weight:400;color:#FFFFFF;background:#161412;-webkit-font-smoothing:antialiased}
.disp{font-family:Tumbly,sans-serif;font-weight:400;letter-spacing:.005em;line-height:1.04;margin:0;text-wrap:balance}
.cat-type{font-family:Marlowe,sans-serif;letter-spacing:.06em}
.wrap{max-width:1280px;margin:0 auto;padding-left:clamp(16px,4vw,64px);padding-right:clamp(16px,4vw,64px)}
p{text-wrap:pretty}
.muted{color:#BDB6AC}
section[id]{scroll-margin-top:84px}
.light{background:#FFFFFF;color:#161412}
.light .muted{color:#5E5850}
.light a{color:#8F6E33}

/* barra black friday */
.bf-bar{display:block;padding:12px 16px;text-align:center;background:#D1AB68;color:#161412;font-size:13px;font-weight:500}
.bf-bar:hover{color:#161412;background:#DDBB7E}
.bf-bar u{text-underline-offset:3px}

/* cabeçalho */
.hdr{position:sticky;top:0;z-index:40;background:rgba(22,20,18,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08)}
.nav-links{display:flex;gap:36px;align-items:center}
.nav-links>a,.dd-trigger{color:#D9D3CA;font-size:14px;transition:color .25s ease}
.nav-links>a:hover,.dd-trigger:hover{color:#FFFFFF}
@media (max-width:1000px){.nav-links{display:none}.hdr-cta{display:none !important}}
.dd{position:relative}
.dd::after{content:"";position:absolute;left:-24px;right:-24px;top:100%;height:24px}
.dd-trigger{display:inline-flex;align-items:center;gap:6px}
.dd-menu{position:absolute;top:calc(100% + 22px);right:-24px;z-index:50;min-width:260px;padding:8px;background:#1F1C19;border:1px solid rgba(255,255,255,.1);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .25s ease,transform .3s ease,visibility .25s}
.dd:hover .dd-menu,.dd:has(:focus-visible) .dd-menu{opacity:1;visibility:visible;transform:none}
.nav-links .dd-menu a{display:block;padding:12px 14px;color:#D9D3CA;font-size:14px}
.nav-links .dd-menu a:hover{background:rgba(209,171,104,.12);color:#FFFFFF}
.dd-sep{height:1px;background:rgba(255,255,255,.08);margin:6px 4px}

/* botões */
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 30px;border-radius:999px;font-family:Montserrat,sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:0;transition:background-color .25s ease,color .25s ease,border-color .25s ease}
.btn:focus-visible{outline:2px solid #FFFFFF;outline-offset:3px}
.btn-gold{background:#D1AB68;color:#161412}
.btn-gold:hover{background:#DDBB7E;color:#161412}
.btn-gold::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-130%);animation:sweep 5s ease-in-out 2.4s infinite}
@keyframes sweep{0%,60%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.btn-line{border:1px solid rgba(255,255,255,.35);color:#FFFFFF;background:transparent}
.btn-line:hover{border-color:#FFFFFF;color:#FFFFFF;background:rgba(255,255,255,.06)}
.btn-dark{background:#161412;color:#FFFFFF}
.btn-dark:hover{background:#2A2622;color:#FFFFFF}
.light .btn-line{border-color:rgba(22,20,18,.3);color:#161412}
.light .btn-line:hover{border-color:#161412;background:rgba(22,20,18,.04);color:#161412}
.txtlink{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}

/* hero: o único momento animado da página */
.hero-glow{position:absolute;right:4%;top:14%;width:620px;height:620px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,214,150,.30),rgba(255,214,150,.08) 55%,rgba(255,214,150,0));pointer-events:none;animation:lampon 2.6s ease-out .4s both}
@keyframes lampon{0%{opacity:0}10%{opacity:.85}15%{opacity:.1}24%{opacity:.95}30%{opacity:.3}46%,100%{opacity:1}}
.pend{margin-top:calc(-1 * clamp(48px, 7vw, 96px))}
@media (min-width:1040px){.pend{align-self:flex-start}}
@media (min-width:1040px){.swing{margin-top:calc(-.4261 * clamp(420px,46vw,660px))}.pend .pimg{height:calc(1.4261 * clamp(420px,46vw,660px))}}
@media (max-width:1060px){.pend{margin-top:0}}
.swing{transform-origin:50% 0;animation:drop 1.8s cubic-bezier(.2,.7,.1,1) .2s both,sway 9s ease-in-out 2.2s infinite}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes sway{0%,100%{transform:rotate(1.2deg)}50%{transform:rotate(-1.2deg)}}
.pimg{display:block;height:clamp(420px,46vw,660px);width:auto;max-width:100%;object-fit:contain}
.hero-copy{animation:fade 1.2s ease 1.1s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* mobile: a câmera começa dentro do lustre e se afasta ao entrar na tela */
@media (max-width:1039px){
.swing{overflow:hidden;position:relative}
.swing.zoom-ready .pimg{transform-origin:50% 36%;transform:scale(2.9);will-change:transform}
.swing.zoom-ready::after{content:"";position:absolute;inset:-2px;pointer-events:none;box-shadow:inset 0 0 110px 52px #161412,inset 0 0 40px 16px #161412,inset 0 0 12px 3px #161412}
.swing.zoom-go .pimg{animation:pullback 3.2s cubic-bezier(.32,.08,.2,1) forwards}
.swing.zoom-go::after{animation:unveil 3.2s linear forwards}
}
@keyframes pullback{from{transform:scale(2.9)}to{transform:scale(1)}}
@keyframes unveil{0%,68%{opacity:1}100%{opacity:0}}
.cat-strip{display:flex;flex-wrap:wrap;gap:12px 48px;padding:26px 0;border-top:1px solid rgba(255,255,255,.08)}
.cat-strip a{font-family:Marlowe,sans-serif;font-size:20px;letter-spacing:.06em;color:#D1AB68}
.cat-strip a:hover{color:#FFFFFF}

/* black friday */
.shine{background:linear-gradient(100deg,#B08A45 0%,#D1AB68 22%,#FFF1D2 32%,#D1AB68 42%,#B08A45 64%,#D1AB68 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-140% 0}}
.bf{border-top:1px solid rgba(255,255,255,.08)}
.cd{display:flex;gap:28px;flex-wrap:wrap}
.cd div{display:flex;flex-direction:column;gap:4px}
.cd-n{font-family:Tumbly,sans-serif;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.cd-l{font-size:13px;color:#9C958B}
.bf-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px 32px;padding:24px 0;border-bottom:1px solid rgba(255,255,255,.1);scroll-margin-top:110px}
.bf-row:target{background:rgba(209,171,104,.08);padding-left:16px;padding-right:16px}

/* formulários */
.panel{background:#1F1C19;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:clamp(24px,3.4vw,44px)}
.bar{height:2px;background:rgba(255,255,255,.1)}
.bar>span{display:block;height:100%;background:#D1AB68;transition:width .5s ease}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{min-height:60px;padding:14px 18px;text-align:left;border-radius:4px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#FFFFFF;font-family:Montserrat,sans-serif;font-size:15px;cursor:pointer;transition:border-color .2s ease,background-color .2s ease}
.opt:hover{border-color:#D1AB68}
.opt:focus-visible{outline:2px solid #D1AB68;outline-offset:2px}
.opt.on{border-color:#D1AB68;background:rgba(209,171,104,.12)}
.step-in{animation:fade .4s ease both}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:13px;font-weight:500;color:#BDB6AC}
.field input{height:54px;padding:0 16px;border-radius:4px;border:1px solid rgba(255,255,255,.18);background:#161412;color:#FFFFFF;font-family:Montserrat,sans-serif;font-size:16px;outline:none;transition:border-color .2s ease}
.field input::placeholder{color:#6F685E}
.field input:focus{border-color:#D1AB68}
.field:has(input[aria-invalid="true"]) input{border-color:#E8A08A}
.err{margin:0;font-size:13px;color:#F0B7A4}
.linkbtn{background:none;border:0;padding:0;min-height:44px;cursor:pointer;font-family:Montserrat,sans-serif;font-size:13px;color:#9C958B;text-decoration:underline;text-underline-offset:4px}
.linkbtn:hover{color:#FFFFFF}

/* fotos de exemplo */
.frame{position:relative;overflow:hidden}
.ph{position:absolute;inset:0;background-color:#24201C;background-image:radial-gradient(circle at 50% 24%,rgba(255,206,140,.34),rgba(255,206,140,0) 40%)}
.light .ph{background-color:#EDE8E0;background-image:radial-gradient(circle at 50% 28%,rgba(255,255,255,.95),rgba(255,255,255,0) 46%)}
.ph-label{position:absolute;left:14px;bottom:12px;font-size:12px;color:#BDB6AC}
.light .ph-label{color:#5E5850}

/* categorias */
.cats-nav{position:sticky;top:83px;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid rgba(22,20,18,.1)}
.cats-nav .wrap{display:flex;gap:36px;overflow-x:auto;scrollbar-width:none}
.cats-nav a{flex:none;display:inline-flex;align-items:center;min-height:56px;font-family:Marlowe,sans-serif;font-size:16px;letter-spacing:.06em;color:#161412}
.cats-nav a:hover{color:#8F6E33}
.cat{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(32px,6vw,96px);align-items:center;padding:clamp(56px,7vw,104px) 0;border-top:1px solid rgba(22,20,18,.1);scroll-margin-top:150px}
.cat.rev{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.cat.rev .cat-media{order:2}
@media (max-width:860px){.cat,.cat.rev{grid-template-columns:minmax(0,1fr)}.cat.rev .cat-media{order:0}}
.cat:target .cat-name{color:#8F6E33}
.prods{grid-column:1/-1;order:3;margin-top:clamp(8px,2vw,24px)}
.prods-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:20px}
.prods-row{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(180px,22vw,248px);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin;scrollbar-color:#D1AB68 transparent}
.prod{scroll-snap-align:start;display:block;color:#161412}
.prod-img{aspect-ratio:4/5;background:#fff;border:1px solid rgba(22,20,18,.08);overflow:hidden}
.prod-img img{width:100%;height:100%;object-fit:contain;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.prod:hover .prod-img img{transform:scale(1.04)}
.prod-name{margin:14px 0 0;font-size:15px;line-height:1.4}
.prod-meta{margin:4px 0 0;font-size:13px;color:#5E5850}
.prod-cta{display:inline-block;margin-top:10px;font-size:13px;color:#8F6E33;border-bottom:1px solid rgba(143,110,51,.35);padding-bottom:2px}
.prod:hover .prod-cta{border-color:#8F6E33}

/* projetos */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px 24px}
.pgrid>a:nth-child(3n+2){margin-top:56px}
@media (max-width:900px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.pgrid>a:nth-child(3n+2){margin-top:0}}
@media (max-width:560px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.pcard{display:block;color:#FFFFFF}
.pcard:hover{color:#FFFFFF}
.pcard:hover .ph{opacity:.85}

/* faq */
.perk{margin-top:36px;padding:24px 26px;border:1px solid rgba(209,171,104,.4);max-width:460px}
.clients{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:28px 20px}
@media (max-width:900px){.clients{grid-template-columns:repeat(2,minmax(0,1fr))}}
.client-img{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#24211E;position:relative}
.client-img img{width:100%;height:100%;object-fit:cover;filter:grayscale(1);transition:filter .5s ease,transform .6s ease}
.client:hover .client-img img{filter:none;transform:scale(1.03)}
.client-ini{font-family:Tumbly,serif;font-size:40px;color:#D1AB68;opacity:.7}
.frame img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.pcard:hover img.cover{transform:scale(1.04)}
.client-name{margin:14px 0 0;font-size:15px;font-weight:600}
.client-role{margin:2px 0 0;font-size:13px;color:#A39C92}
.bf-top{max-width:880px}
.bfside{--pw:min(320px,78vw);position:fixed;top:50%;right:0;z-index:70;display:flex;align-items:center;transform:translate(var(--pw),-50%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.bfside.open{transform:translate(0,-50%)}
.bfside-tab{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 12px;border:0;border-radius:8px 0 0 8px;background:#FDBD03;color:#FFFFFF;cursor:pointer;box-shadow:-10px 10px 30px -12px rgba(0,0,0,.6);font-family:Montserrat,sans-serif}
.bfside-tab:hover{background:#F2B000}
.bfside-ic{position:relative;width:20px;height:14px;display:block}
.bfside-ic i{position:absolute;left:0;width:20px;height:2px;border-radius:2px;background:#FFFFFF;transition:transform .35s ease,opacity .25s ease,top .35s ease}
.bfside-ic i:nth-child(1){top:0}.bfside-ic i:nth-child(2){top:6px}.bfside-ic i:nth-child(3){top:12px}
.bfside.open .bfside-ic i:nth-child(1){top:6px;transform:rotate(45deg)}
.bfside.open .bfside-ic i:nth-child(2){opacity:0}
.bfside.open .bfside-ic i:nth-child(3){top:6px;transform:rotate(-45deg)}
.bfside-txt{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:700;letter-spacing:.08em;color:#FFFFFF;white-space:nowrap;text-shadow:0 1px 2px rgba(120,80,0,.35)}
.bfside-panel{width:var(--pw);background:#161412;border:1px solid rgba(209,171,104,.35);border-right:0;box-shadow:none;visibility:hidden;transition:visibility 0s linear .6s,box-shadow .3s ease}
.bfside.open .bfside-panel{visibility:visible;box-shadow:-20px 20px 60px -20px rgba(0,0,0,.75);transition-delay:0s}
.bfside-panel a{display:block}
.bfside-panel img{display:block;width:100%;height:auto}
@media (max-width:700px){.bfside-tab{padding:14px 9px;gap:10px}.bfside-txt{font-size:11px}}
.bfpop{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .35s ease both}
.bfpop-bg{position:absolute;inset:0;border:0;padding:0;background:rgba(10,9,8,.78);backdrop-filter:blur(3px);cursor:pointer}
.bfpop-box{position:relative;width:min(480px,92vw,calc(88vh * .8));animation:popin .5s cubic-bezier(.2,.8,.2,1) both}
.bfpop-box img{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
.bfpop-x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:999px;border:0;background:#161412;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.bfpop-x:hover{background:#D1AB68;color:#161412}
@keyframes popin{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.faq-a{animation:fade .3s ease both}

/* whatsapp flutuante */
.dock{position:sticky;bottom:0;height:0;z-index:45}
.dock-in{position:absolute;right:clamp(16px,3vw,32px);bottom:clamp(16px,3vw,32px);z-index:60;display:flex;gap:10px;align-items:center}
.wa{display:inline-flex;align-items:center;gap:12px;padding:8px 22px 8px 8px;border-radius:999px;background:#161412;color:#FFFFFF;border:1px solid rgba(209,171,104,.55);box-shadow:0 14px 34px -12px rgba(0,0,0,.7);transition:transform .3s ease,border-color .3s ease}
.wa:hover{color:#FFFFFF;transform:translateY(-2px);border-color:#D1AB68}
.wa-ic{width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#25D366;color:#FFFFFF;flex:none}
.wa-tx{display:flex;flex-direction:column;line-height:1.15;font-family:Montserrat,sans-serif}
.wa-tx small{font-size:11px;color:#D1AB68;letter-spacing:.02em}
.wa-tx strong{font-size:15px;font-weight:600}
.dock-cta{display:none}
@media (max-width:700px){.dock-in{left:16px;right:16px;bottom:16px}.dock-cta{display:inline-flex;flex:1}.wa{padding:6px}.wa-tx{display:none}}

@media (prefers-reduced-motion: reduce){
*,*::before,*::after{animation:none !important;transition:none !important}
}
</style>

</head>
<body>
<div class="page" id="app" style="width: 100%"></div>
<noscript><p style="color:#fff;background:#161412;padding:24px;font-family:sans-serif">Ative o JavaScript para ver o site completo da BellaLuz.</p></noscript>
<template id="dc-tpl">
<div class="page" style="width: 100%">

<div class="page" style="width: 100%">

<!-- BARRA BLACK FRIDAY -->
<sc-if value="{{bfOn}}" hint-placeholder-val="{{true}}">
<a class="bf-bar" href="#black-friday">{{bfTag}}: até 70% off em peças selecionadas. <u>Ver condições</u></a>
</sc-if>

<!-- CABEÇALHO -->
<header class="hdr">
<div class="wrap" style="height: 82px; display: flex; align-items: center; justify-content: space-between; gap: 24px">
<a href="#inicio" aria-label="BellaLuz lighting store, início" style="display: flex; align-items: center">
<img src="/assets/img/bellaluz-logo.png" alt="BellaLuz lighting store" style="height: 52px; width: auto; display: block">
</a>
<nav class="nav-links" aria-label="Principal">
<sc-if value="{{bfOn}}" hint-placeholder-val="{{true}}"><a href="#black-friday" style="color: #D1AB68">Black Friday</a></sc-if>
<a href="#projetos">Projetos</a>
<a href="#processo">Como trabalhamos</a>
<a href="arquitetos.html">Arquitetos</a>
<div class="dd">
<a class="dd-trigger" href="#categorias" aria-haspopup="true">Showroom
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
<div class="dd-menu">
<a href="#pendentes">Pendentes</a>
<a href="#lustres">Lustres</a>
<a href="#arandelas">Arandelas</a>
<a href="#embutidos-e-led">Embutidos e LED</a>
<a href="#iluminacao-externa">Iluminação externa</a>
<div class="dd-sep"></div>
<a href="#showroom">Endereço e horário</a>
</div>
</div>
</nav>
<a class="btn btn-gold hdr-cta" href="#consultoria" style="min-height: 44px; padding: 0 24px; font-size: 13px">Agendar consultoria</a>
</div>
</header>

<!-- HERO -->
<section id="inicio" style="position: relative; overflow: hidden">
<div class="hero-glow" aria-hidden="true"></div>
<div class="wrap" style="position: relative">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 48px 64px; padding-top: clamp(48px, 7vw, 96px); padding-bottom: clamp(48px, 6vw, 80px)">
<div class="hero-copy" style="flex: 999 1 520px; min-width: 0">
<h1 class="disp" style="font-size: clamp(52px, 6.4vw, 100px)">Luz que revela o melhor da sua arquitetura.</h1>
<p class="muted" style="margin: 32px 0 0; max-width: 520px; font-size: 18px; font-weight: 300; line-height: 1.65">Projeto luminotécnico e peças exclusivas, desenhados com você por arquitetos especialistas em luz. Showroom em Ribeirão Preto.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 40px">
<a class="btn btn-gold" href="#consultoria">Agendar minha consultoria</a>
<a class="btn btn-line" href="#projetos">Ver projetos</a>
</div>
</div>
